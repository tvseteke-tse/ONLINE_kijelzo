<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TTSE Bajnoki Mérkőzés Élő Eredmények</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100vw;
        height: 100dvh; /* Dinamikus kijelzőmagasság mobil böngészőkhöz */
        overflow: hidden;
        background-color: #000c1f;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    .main-board {
        width: 100vw;
        height: 100dvh;
        padding: 0.4dvh 0.6vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    
    .match-block {
        background-color: #001c47;
        border: 2px solid #0044aa;
        border-radius: 6px;
        padding: 0.2dvh 0.4vw;
        box-shadow: 0 0 10px rgba(0, 50, 150, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    /* Pontos arányok a keretben */
    #blockIfi { height: 31%; flex: 0 0 31%; }
    #blockAdult { height: 67%; flex: 0 0 67%; }

    /* FEJLÉCEK */
    .header-container {
        text-align: center;
        flex: 0 0 auto;
    }

    .tournament-header {
        font-size: clamp(0.6rem, 1.3dvh, 1rem);
        color: #00ff66;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
        white-space: nowrap;
    }

    .teams-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.1dvh 0.3vw;
        border-bottom: 1px solid #0044aa;
        flex: 0 0 auto;
    }

    .team-box {
        display: flex;
        align-items: center;
        gap: 0.4vw;
        font-size: clamp(0.7rem, 1.5dvh, 1.3rem);
        line-height: 1;
        color: #ffff00;
        font-weight: 900;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(255, 255, 0, 0.5);
        white-space: nowrap;
        overflow: hidden;
    }
    
    .team-logo {
        height: 2.2dvh;
        width: auto;
        max-width: 5vw;
        object-fit: contain;
        flex-shrink: 0;
    }

    .matesz-logo {
        height: 2dvh;
        filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.5));
        flex-shrink: 0;
    }

    /* TÁBLÁZAT PRÉSELÉSE */
    .table-container {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .board-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-family: 'Courier New', Courier, monospace;
    }

    .board-table th { 
        color: #ffff00; 
        border-bottom: 1px solid #0044aa;
        font-size: clamp(0.45rem, 1dvh, 0.8rem);
        padding: 0;
        height: 1.8dvh;
    }
    
    .board-table td { 
        text-align: center; 
        font-weight: bold; 
        border-bottom: 1px solid #002b66; 
        vertical-align: middle;
        padding: 0;
    }

    #blockIfi .board-table td { font-size: clamp(0.55rem, 1.3dvh, 0.95rem); }
    #blockAdult .board-table td { font-size: clamp(0.6rem, 1.4dvh, 1.05rem); }

    .name-col { 
        text-align: left !important; 
        color: #ffff00; 
        width: 22%; 
        font-family: sans-serif; 
        font-size: clamp(0.5rem, 1.2dvh, 0.95rem) !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .name-col.right { text-align: right !important; }
    
    .val-set { color: #ffffff; }
    .val-set.win { color: #00ff66; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .val-set.lose { color: #ff3333; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }
    .val-set.draw { color: #ffff00; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    
    .val-sp { color: #ffffff; }
    .val-ges { color: #ffffff; }
    .val-ges.win { color: #00ff66; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .val-ges.draw { color: #ffff00; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .val-mp { color: #ffff00; background-color: #00122e; }
    .divider { border-left: 1px solid #0044aa; border-right: 1px solid #0044aa; }
    
    /* LÁBLÉC FIXÁLÁSA */
    .footer-score {
        flex: 0 0 auto;
        border-top: 1px solid #0044aa;
        padding-top: 0.1dvh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: sans-serif;
        color: #ffffff;
        height: 2.5dvh;
    }
    .footer-team-block { display: flex; gap: 0.4vw; align-items: center; }
    .footer-label { color: #8b949e; font-size: clamp(0.45rem, 1dvh, 0.8rem); }
    .footer-val { color: #ffff00; font-weight: bold; font-size: clamp(0.55rem, 1.2dvh, 0.95rem); }
    
    .footer-center-group {
        display: flex;
        align-items: center;
        gap: 1vw;
    }
    .total-ges-big {
        color: #ffff00;
        font-size: clamp(0.65rem, 1.4dvh, 1.1rem);
        font-weight: bold;
        line-height: 1;
        display: flex;
        align-items: center;
        gap: 0.3vw;
    }
    .total-mp { 
        color: #00ff66; 
        font-size: clamp(0.7rem, 1.6dvh, 1.3rem); 
        font-weight: bold; 
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); 
        line-height: 1; 
    }

    /* DIFF FORMÁZÁSA A FA MELLETT */
    .diff-val {
        font-size: clamp(0.55rem, 1.1dvh, 0.85rem);
        font-weight: bold;
    }
    .diff-val.plus { color: #00ff66; text-shadow: 0 0 5px rgba(0, 255, 102, 0.4); }
    .diff-val.minus { color: #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }
    .diff-val.zero { color: #ffff00; text-shadow: 0 0 5px rgba(255, 255, 0, 0.4); }

    .match-divider {
        height: 2px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #ffff00, #00ff66, #0044aa);
        flex: 0 0 auto;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="main-board">

    <!-- IFI MECCS BLOKK -->
    <div class="match-block" id="blockIfi">
        <div class="header-container">
            <div class="tournament-header" id="titleIfi">IFI BAJNOKI MÉRKŐZÉS</div>
        </div>
        <div class="teams-header">
            <div class="team-box">
                <span id="team1Ifi">HAZAI IFI</span>
                <img id="logo1Ifi" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" alt="">
            </div>

            <img class="matesz-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/871712f3931057892c33bbc94359b6dd73762870/MATESZ_logo-removebg-preview.png" alt="MATESZ Logo">

            <div class="team-box">
                <img id="logo2Ifi" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/7767f16ffa80fcf1cdcba723498b6a26453fcf2c/let%C3%B6lt%C3%A9s-removebg-preview.png" alt="">
                <span id="team2Ifi">VENDÉG IFI</span>
            </div>
        </div>
        <div class="table-container">
            <table class="board-table">
                <thead>
                    <tr>
                        <th class="name-col">Név</th>
                        <th>1</th><th>2</th><th>3</th><th>4</th><th>SP</th>
                        <th>Össz.</th><th>MP</th><th>Össz.</th><th>SP</th>
                        <th>4</th><th>3</th><th>2</th><th>1</th>
                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyIfi"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp1Ifi">0</span></div>
            </div>
            <div class="footer-center-group">
                <div class="total-ges-big">
                    <span class="diff-val zero" id="diff1Ifi">(0)</span>
                    <span id="ges1Ifi">0</span> fa
                </div>
                <div class="total-mp" id="mpIfi">0 : 0</div>
                <div class="total-ges-big">
                    <span id="ges2Ifi">0</span> fa
                    <span class="diff-val zero" id="diff2Ifi">(0)</span>
                </div>
            </div>
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Ifi">0</span></div>
            </div>
        </div>
    </div>

    <div class="match-divider"></div>

    <!-- FELNŐTT MECCS BLOKK -->
    <div class="match-block" id="blockAdult">
        <div class="header-container">
            <div class="tournament-header" id="titleAdult">FELNŐTT BAJNOKI MÉRKŐZÉS</div>
        </div>
        <div class="teams-header">
            <div class="team-box">
                <span id="team1Adult">HAZAI</span>
                <img id="logo1Adult" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" alt="">
            </div>

            <img class="matesz-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/871712f3931057892c33bbc94359b6dd73762870/MATESZ_logo-removebg-preview.png" alt="MATESZ Logo">

            <div class="team-box">
                <img id="logo2Adult" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/7767f16ffa80fcf1cdcba723498b6a26453fcf2c/let%C3%B6lt%C3%A9s-removebg-preview.png" alt="">
                <span id="team2Adult">VENDÉG</span>
            </div>
        </div>
        <div class="table-container">
            <table class="board-table">
                <thead>
                    <tr>
                        <th class="name-col">Név</th>
                        <th>1</th><th>2</th><th>3</th><th>4</th><th>SP</th>
                        <th>Össz.</th><th>MP</th><th>Össz.</th><th>SP</th>
                        <th>4</th><th>3</th><th>2</th><th>1</th>
                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyAdult"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp1Adult">0</span></div>
            </div>
            <div class="footer-center-group">
                <div class="total-ges-big">
                    <span class="diff-val zero" id="diff1Adult">(0)</span>
                    <span id="ges1Adult">0</span> fa
                </div>
                <div class="total-mp" id="mpAdult">0 : 0</div>
                <div class="total-ges-big">
                    <span id="ges2Adult">0</span> fa
                    <span class="diff-val zero" id="diff2Adult">(0)</span>
                </div>
            </div>
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Adult">0</span></div>
            </div>
        </div>
    </div>

</div>

<script>
// Külön alapértelmezett logók a Hazai és Vendég csapatoknak
const DEFAULT_HAZAI_LOGO = "https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png";
const DEFAULT_VENDEG_LOGO = "https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/7767f16ffa80fcf1cdcba723498b6a26453fcf2c/let%C3%B6lt%C3%A9s-removebg-preview.png";

const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('osszevont_bajnoki_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.ifi) renderSection('Ifi', data.ifi);
        if (data.adult) renderSection('Adult', data.adult);
    }
});

function getSetClass(val1, val2) {
    if (val1 === 0 && val2 === 0) return 'val-set';
    if (val1 > val2) return 'val-set win';
    if (val1 < val2) return 'val-set lose';
    return 'val-set draw';
}

function updateLogo(elementId, logoUrl, fallbackUrl = '') {
    const imgEl = document.getElementById(elementId);
    const targetUrl = (logoUrl && logoUrl.trim() !== '') ? logoUrl : fallbackUrl;
    
    if (targetUrl) {
        imgEl.src = targetUrl;
        imgEl.style.display = 'inline-block';
    } else {
        imgEl.style.display = 'none';
        imgEl.src = '';
    }
}

function renderSection(type, sectionData) {
    if (sectionData.title) document.getElementById(`title${type}`).innerText = sectionData.title.toUpperCase();
    document.getElementById(`team1${type}`).innerText = sectionData.team1 || 'HAZAI';
    document.getElementById(`team2${type}`).innerText = sectionData.team2 || 'VENDÉG';

    // Külön kezelt fallback logók a Hazai és a Vendég oldalra
    updateLogo(`logo1${type}`, sectionData.logo1, DEFAULT_HAZAI_LOGO);
    updateLogo(`logo2${type}`, sectionData.logo2, DEFAULT_VENDEG_LOGO);

    const tbody = document.getElementById(`body${type}`);
    tbody.innerHTML = '';

    let totalGes1 = 0, totalGes2 = 0;
    let totalSp1 = 0, totalSp2 = 0;
    let totalMp1 = 0, totalMp2 = 0;

    if (sectionData.pairs && Array.isArray(sectionData.pairs)) {
        sectionData.pairs.forEach(row => {
            const sum1 = row.p1Sets.reduce((a, b) => a + b, 0);
            const sum2 = row.p2Sets.reduce((a, b) => a + b, 0);

            let sp1 = 0, sp2 = 0;
            row.p1Sets.forEach((s1, idx) => {
                const s2 = row.p2Sets[idx];
                if (s1 > s2) sp1 += 1;
                else if (s2 > s1) sp2 += 1;
                else if (s1 > 0 || s2 > 0) { sp1 += 0.5; sp2 += 0.5; }
            });

            let mp1 = 0, mp2 = 0;
            if (sum1 > 0 || sum2 > 0) {
                if (sp1 > sp2) mp1 = 1;
                else if (sp2 > sp1) mp2 = 1;
                else if (sum1 > sum2) mp1 = 1;
                else if (sum2 > sum1) mp2 = 1;
                else { mp1 = 0.5; mp2 = 0.5; }
            }

            totalGes1 += sum1; totalGes2 += sum2;
            totalSp1 += sp1; totalSp2 += sp2;
            totalMp1 += mp1; totalMp2 += mp2;

            // Összes fa színezése az MP alapján (nyertes: zöld, döntetlen: sárga)
            let ges1Class = '', ges2Class = '';
            if (sum1 > 0 || sum2 > 0) {
                if (mp1 > mp2) {
                    ges1Class = 'win';
                } else if (mp2 > mp1) {
                    ges2Class = 'win';
                } else {
                    ges1Class = 'draw';
                    ges2Class = 'draw';
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="name-col">${row.p1Name || '-'}</td>
                ${row.p1Sets.map((s1, i) => `<td class="${getSetClass(s1, row.p2Sets[i])}">${s1 || ''}</td>`).join('')}
                <td class="val-sp">${sp1}</td>
                <td class="val-ges ${ges1Class}">${sum1}</td>
                <td class="val-mp divider">${mp1}:${mp2}</td>
                <td class="val-ges ${ges2Class}">${sum2}</td>
                <td class="val-sp">${sp2}</td>
                ${row.p2Sets.slice().reverse().map((s2, i) => {
                    const origIdx = 3 - i;
                    return `<td class="${getSetClass(s2, row.p1Sets[origIdx])}">${s2 || ''}</td>`;
                }).join('')}
                <td class="name-col right">${row.p2Name || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    let teamBonus1 = 0, teamBonus2 = 0;
    if (totalGes1 > totalGes2) teamBonus1 = 2;
    else if (totalGes2 > totalGes1) teamBonus2 = 2;
    else if (totalGes1 > 0 || totalGes2 > 0) { teamBonus1 = 1; teamBonus2 = 1; }

    document.getElementById(`sp1${type}`).innerText = totalSp1;
    document.getElementById(`sp2${type}`).innerText = totalSp2;
    document.getElementById(`ges1${type}`).innerText = totalGes1;
    document.getElementById(`ges2${type}`).innerText = totalGes2;
    document.getElementById(`mp${type}`).innerText = `${totalMp1 + teamBonus1} : ${totalMp2 + teamBonus2}`;

    // Különbség kiszámítása
    const diff1El = document.getElementById(`diff1${type}`);
    const diff2El = document.getElementById(`diff2${type}`);
    const diff = totalGes1 - totalGes2;

    if (diff > 0) {
        diff1El.innerText = `(+${diff})`;
        diff1El.className = 'diff-val plus';
        diff2El.innerText = `(-${diff})`;
        diff2El.className = 'diff-val minus';
    } else if (diff < 0) {
        diff1El.innerText = `(${diff})`;
        diff1El.className = 'diff-val minus';
        diff2El.innerText = `(+${Math.abs(diff)})`;
        diff2El.className = 'diff-val plus';
    } else {
        diff1El.innerText = '(0)';
        diff1El.className = 'diff-val zero';
        diff2El.innerText = '(0)';
        diff2El.className = 'diff-val zero';
    }
}
</script>
</body>
</html>
